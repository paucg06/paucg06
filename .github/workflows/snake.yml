name: Generate Snake Animation

on:
  schedule:
    # Se ejecuta automáticamente todos los días a medianoche (UTC)
    - cron: "0 0 * * *"
  # Permite ejecutarlo manualmente desde la pestaña Actions en GitHub
  workflow_dispatch:
  # Se ejecuta automáticamente en cada push a main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generar SVGs de la Serpiente Multi-Cuenta (paucg06 + Eterno-Dev)
        run: node scripts/generate_snake.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Subir a la rama Output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
