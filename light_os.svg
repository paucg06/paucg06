<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="ConsolasFallback,Consolas,monospace" width="985px" height="120px" text-anchor="middle" font-size="16px">
<style>
@font-face {
src: local('Consolas'), local('Consolas Bold');
font-family: 'ConsolasFallback';
font-display: swap;
-webkit-size-adjust: 109%;
size-adjust: 109%;
}
  
.big { font-size: 20px; }
.small { font-size: 14px; }
.italic { font-style: italic; }

.key {fill: #953800;}
.value {fill: #0a3069;}
